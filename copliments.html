            overflow: hidden;

            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: 0;
            animation: float 20s infinite ease-in-out;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: #8b5cf6;
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 350px;
            height: 350px;
            background: #ec4899;
            bottom: -80px;
            right: -80px;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 250px;
            height: 250px;
            background: #06b6d4;
            top: 50%;
            left: 70%;
            animation-delay: -10s;
        }

            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -40px) scale(1.1); }
            66% { transform: translate(-20px, 30px) scale(0.9); }
        }

            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            padding: 55px 50px;
            max-width: 680px;
            width: 100%;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        .icon-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(236, 72, 153, 0.3));
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 22px;
            animation: pulse 3s ease-in-out infinite;

            0%, 100% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.4); }
            50% { box-shadow: 0 0 0 15px rgba(139, 92, 246, 0); }

            width: 34px;
            height: 34px;
            stroke: #e9d5ff;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;

            font-weight: 600;
            color: #ffffff;

            color: rgba(255, 255, 255, 0.55);

            letter-spacing: 0.08em;

            align-items: center;
            justify-content: center;
            margin-bottom: 35px;
            padding: 0 10px;
            position: relative;

        .phrase {

            font-size: 1.7rem;
            line-height: 1.5;
            color: #f5f3ff;
            font-weight: 400;
            transition: opacity 0.5s ease, transform 0.5s ease;
            text-shadow: 0 2px 20px rgba(139, 92, 246, 0.3);

            opacity: 0;
            transform: translateY(-10px);
        }

            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;

            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }

            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 18px 40px;
            font-family: 'Inter', sans-serif;

            font-weight: 600;

            left: -100%;
            width: 100%;
            height: 100%;

</head>

                    "Даже у супергероев бывают плохие дни. Но не у тебя! (шутка) 🦸",

                    "Ты — как хорошее вино. С годами только лучше. 🍷",
                    "Не переживай. Всё, что ни делается, — к лучшему сериалу. 📺",
                    "Ты способен на всё. Даже на то, чтобы выспаться. 😴",
                    "Если жизнь даёт лимоны — сделай лимонад. Или текилу. Выбор за тобой. 🍋",
                    "Ты — не пылинка. Ты — целая планета. 🪐",
                    "Не бойся провалов. Даже WiFi иногда падает. 📶",
                    "Ты — лучше, чем вчера. Даже если вчера был(а) супер. 🌟",
                    "Пусть всё идёт по плану... даже если это план «ничего не делать». 📋",
                    "Ты — магнит для хороших вещей. 🧲",
                    "Сегодня прекрасный день, чтобы быть собой. А ты — огонь. 🔥",
                    "Ты не одинок. За тобой наблюдают... твои мечты. 👀"
                ]
            }
        };

        // Собираем все фразы в один массив с указанием категории
        const allPhrases = [];
        for (const key in phrasesData) {
            phrasesData[key].phrases.forEach(text => {
                allPhrases.push({ text, category: key });
            });
        }

        const phraseEl = document.getElementById('phrase');
        const generateBtn = document.getElementById('generateBtn');
        const counterEl = document.getElementById('counter');
        const totalCountEl = document.getElementById('totalCount');
        const categoryBadge = document.getElementById('categoryBadge');

        // Обновляем общее количество в базе
        totalCountEl.textContent = allPhrases.length;

        let counter = 0;
        let lastIndex = -1;
        let isAnimating = false;

        const categoryColors = {
            inspiration: { bg: 'rgba(139, 92, 246, 0.2)', border: 'rgba(139, 92, 246, 0.3)', color: '#e9d5ff' },
            comfort:     { bg: 'rgba(6, 182, 212, 0.2)', border: 'rgba(6, 182, 212, 0.3)', color: '#a5f3fc' },
            strength:    { bg: 'rgba(236, 72, 153, 0.2)', border: 'rgba(236, 72, 153, 0.3)', color: '#fbcfe8' },
            love:        { bg: 'rgba(244, 63, 94, 0.2)', border: 'rgba(244, 63, 94, 0.3)', color: '#fecdd3' },
            wisdom:      { bg: 'rgba(16, 185, 129, 0.2)', border: 'rgba(16, 185, 129, 0.3)', color: '#a7f3d0' },
            humor:       { bg: 'rgba(245, 158, 11, 0.2)', border: 'rgba(245, 158, 11, 0.3)', color: '#fde68a' }
        };

        function getRandomPhrase() {
            let index;
            do {
                index = Math.floor(Math.random() * allPhrases.length);
            } while (index === lastIndex && allPhrases.length > 1);
            lastIndex = index;
            return allPhrases[index];
        }

        function updateCategoryBadge(categoryKey) {
            const data = phrasesData[categoryKey];
            const colors = categoryColors[categoryKey];
            categoryBadge.textContent = data.name;
            categoryBadge.style.background = colors.bg;
            categoryBadge.style.borderColor = colors.border;
            categoryBadge.style.color = colors.color;
        }

        function generatePhrase() {
            if (isAnimating) return;
            isAnimating = true;

            phraseEl.classList.remove('fade-in');
            phraseEl.classList.add('fade-out');

            setTimeout(() => {
                const item = getRandomPhrase();
                phraseEl.textContent = item.text;
                updateCategoryBadge(item.category);

                phraseEl.classList.remove('fade-out');
                phraseEl.classList.add('fade-in');

                counter++;
                counterEl.textContent = counter;

                setTimeout(() => {
                    isAnimating = false;
                }, 300);
            }, 400);
        }

        generateBtn.addEventListener('click', generatePhrase);

        window.addEventListener('load', () => {
            setTimeout(() => {
                const item = getRandomPhrase();
                phraseEl.textContent = item.text;
                updateCategoryBadge(item.category);
                phraseEl.classList.add('fade-in');
                counter = 1;
                counterEl.textContent = counter;
            }, 800);
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && document.activeElement !== generateBtn) {
                e.preventDefault();
                generatePhrase();
            }
        });
    </script>
</body>
</html>
